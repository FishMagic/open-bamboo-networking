# Build the Linux arm64 artifacts in the Debian central arm64 environment.
# Checkout and artifact transfer stay on the GitHub-hosted ARM runner;
# configure, compile, tests, and ABI verification run inside the image.

name: Build ARM Linux (Debian central)

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-abi:
    name: Discover ABI versions
    runs-on: ubuntu-24.04
    outputs:
      abi-matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: List ABI versions from abi_snapshot dirs
        id: list
        run: |
          set -euo pipefail
          VERSIONS=$(ls -d tools/abi_snapshot/v*/ \
            | sed 's|.*/v||; s|/$||' \
            | jq -Rnc '[inputs]')
          echo "matrix=$VERSIONS" >> "$GITHUB_OUTPUT"
          echo "Discovered ABI versions: $VERSIONS"

  build:
    name: v${{ matrix.abi }}.xx-linux-aarch64-debian-central
    needs: [discover-abi]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(needs.discover-abi.outputs.abi-matrix) }}

    env:
      DEBIAN_CENTRAL_IMAGE: ghcr.io/fishmagic/uos20e-arm64:central-buster

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Pull and validate Debian central ARM64 build image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          if ! printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin; then
            echo "::warning::GHCR authentication failed; continuing with an anonymous pull."
          fi
          if ! docker pull --platform linux/arm64 "$DEBIAN_CENTRAL_IMAGE"; then
            echo "::error::Unable to pull $DEBIAN_CENTRAL_IMAGE. Build or publish the central image from FishMagic/uos20-arm-oci first."
            exit 1
          fi
          image_platform=$(docker image inspect "$DEBIAN_CENTRAL_IMAGE" \
            --format '{{.Os}}/{{.Architecture}}')
          test "$image_platform" = linux/arm64 || {
            echo "::error::Expected $DEBIAN_CENTRAL_IMAGE to be linux/arm64, got $image_platform"
            exit 1
          }

      - name: Configure, build, test, and verify in Debian central container
        run: |
          docker run --rm --platform linux/arm64 \
            --user 0:0 \
            --env HOME=/tmp/obn-home \
            --volume "$GITHUB_WORKSPACE:/work" \
            --workdir /work \
            "$DEBIAN_CENTRAL_IMAGE" \
            -lc 'set -euo pipefail
              mkdir -p "$HOME"
              git config --global --add safe.directory /work
              export DEBIAN_FRONTEND=noninteractive
              apt_options=(
                -o Acquire::Check-Valid-Until=false
                -o Acquire::AllowInsecureRepositories=true
                -o APT::Get::AllowUnauthenticated=true
              )
              apt-get update "${apt_options[@]}"
              uthash_tmp=$(mktemp -d)
              (
                cd "$uthash_tmp"
                apt-get "${apt_options[@]}" download uthash-dev
              )
              uthash_deb=$(find "$uthash_tmp" -maxdepth 1 -type f \
                -name "uthash-dev_*.deb" -print -quit)
              test -n "$uthash_deb"
              dpkg-deb -x "$uthash_deb" /
              rm -rf "$uthash_tmp"
              cmake_version=3.31.12
              cmake_tmp=$(mktemp -d)
              cmake_archive="$cmake_tmp/cmake.tar.gz"
              curl -fsSL \
                "https://cmake.org/files/v3.31/cmake-${cmake_version}-linux-aarch64.tar.gz" \
                -o "$cmake_archive"
              printf '%s  %s\n' \
                83f8fd91d2038a56556e1400390fcfe42f79602940c494f6c6f1cdae7f9e7f40 \
                "$cmake_archive" | sha256sum -c -
              tar -xzf "$cmake_archive" -C "$cmake_tmp"
              export PATH="$cmake_tmp/cmake-${cmake_version}-linux-aarch64/bin:$PATH"
              cmake --version
              ./configure \
                --build-type=Release \
                --enable-tests \
                --with-version="${{ matrix.abi }}.99" \
                --no-conf-patch
              make -j"$(nproc)"
              make test
              tools/check_abi_compat.sh \
                --abi="${{ matrix.abi }}" \
                --so=build/libbambu_networking.so'

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          cp build/libbambu_networking.so dist/
          cp build/libBambuSource.so      dist/
          cp build/liblive555.so          dist/
          cp build/network_plugins.json   dist/
          ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: obn-linux-v${{ matrix.abi }}.xx-aarch64-debian-central
          path: dist/
          if-no-files-found: error
